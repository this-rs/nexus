# Index des diagrammes de ce depot (charte : docs/DOCUMENTATION.md, ICI -- le
# depot principal garde la sienne pour la cartographie inter-depots). Verifie
# hors reseau par claude-code-api/tests/diagram_index.rs -- aucun appel reseau,
# aucun sous-processus, aucune nouvelle chaine d'outils dans un depot Rust.
#
# Sous-ensemble YAML strict, identique a celui de l'index principal : entrees
# "- name:", scalaires "cle: valeur", liste "covers:" de "- glob".
# Globs prefixes par depot (ici toujours "nexus:") de sorte que ces entrees
# puissent etre reprises telles quelles dans l'index principal.
#
# status: planned = diagramme prevu, pas de fichier .mmd (on n'exporte pas un
#   contenu non verifie contre le code) ; le champ file: est alors absent.
# status: verified = docs/diagrams/<name>.mmd existe, son en-tete est valide,
#   et son contenu a ete relu contre le code au sha du champ verified.
#
# TRANCHE (tache 0.2) : les deux index coexistent, et ce n'est plus un
#   arrangement tacite mais une regle verifiee. Cet index possede les diagrammes
#   dont le .mmd vit ICI ; l'index principal possede la cartographie po-*, dont
#   po-nexus-sdk qui porte des globs "nexus:" pour un .mmd qui vivrait la-bas.
#   Deux garde-fous, verifies a chaque execution du verificateur principal
#   (scripts/diagrams/check-index.mjs, fonction localIndexOwners) :
#     1. un index local ne possede que des chemins de SON depot -- un glob
#        "frontend:" ici serait une revendication sur un depot qui ne le voit
#        pas, il est ignore ;
#     2. si cet index et l'index principal revendiquent le MEME fichier, c'est
#        une ERREUR nommant les deux revendications : deux gates se
#        contrediraient, et chacun se croirait couvert par l'autre.
#   Etat mesure : aucune collision. Les 24 fichiers possedes ici sortent du
#   compte des orphelins du depot principal, parce qu'ils ont un proprietaire.
#   Seule une entree `verified` possede, ici comme la-bas : la regle vient de
#   owning_globs() dans diagram_index.rs, et elle a corrige un chiffre faux
#   dans l'index principal (734 orphelins annonces, 1201 en realite).
diagrams:
  - name: release-readiness
    file: docs/diagrams/release-readiness.mmd
    owner: theotime
    status: verified
    verified: dc510d5
    covers:
      - "nexus:Cargo.toml"
      - "nexus:claude-code-api/Cargo.toml"
      - "nexus:claude-code-sdk-rs/Cargo.toml"
      - "nexus:README.md"
      - "nexus:README_CN.md"
      - "nexus:README_JA.md"
      - "nexus:CHANGELOG.md"
      - "nexus:docs/allowed-hosts.txt"
      - "nexus:docs/RELEASE_READINESS.md"
      - "nexus:.github/workflows/release.yml"
      - "nexus:script/check-version-consistency.sh"
      - "nexus:claude-code-api/tests/release_readiness.rs"

  - name: po-bugs
    file: docs/diagrams/po-bugs.mmd
    owner: theotime
    status: verified
    verified: 8ac7830
    covers:
      - "nexus:docs/BUGS.md"
      - "nexus:claude-code-api/tests/bug_registry.rs"
  - name: nexus-model-catalogue
    file: docs/diagrams/nexus-model-catalogue.mmd
    owner: theotime
    status: verified
    verified: 9540068
    covers:
      - "nexus:claude-code-api/src/core/model_registry.rs"
      - "nexus:claude-code-api/src/models/claude.rs"
      - "nexus:claude-code-api/src/api/models.rs"
      - "nexus:claude-code-api/tests/docs_model_drift.rs"
      - "nexus:README.md"
      - "nexus:README_CN.md"
      - "nexus:README_JA.md"
      - "nexus:docs/valid-models.md"
      - "nexus:docs/tool-calling.md"
      - "nexus:docs/url-preview-integration.md"
      - "nexus:docs/url-preview-troubleshooting.md"
      - "nexus:claude-code-sdk-rs/docs/models-guide.md"
      - "nexus:claude-code-sdk-rs/examples/README_MODELS.md"
