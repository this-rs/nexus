# cargo-about configuration: THIRD-PARTY-LICENSES.txt, shipped in the release archives
# (.github/workflows/release.yml). `accepted` mirrors deny.toml's [licenses].allow (plus
# OpenSSL, which deny.toml's ring clarification names): keep the two in step.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "Unlicense",
    "OpenSSL",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
ignore-dev-dependencies = true
workarounds = ["ring"]
