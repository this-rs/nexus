# cargo-mutants configuration for the T3 mutation-testing pass (docs/CI_CD.md, "Mutation testing").
# Scope: the behaviour-critical zones of the agent contract.
#   1. provider event mapping   claude_code/map_events.rs, acp/map.rs, codex/map.rs
#   2. the ToolPolicy decision  agent/policy.rs, native/policy_args.rs
#   3. tool_calls assembly      model/wire.rs (SSE deltas -> ToolCallChunk)
#   5. retryable classification agent/error.rs
# (4. the budget lives in a function-level slice of native/loop.rs: see .cargo/mutants-budget.toml.)
# Do not combine examine_globs with examine_re here: the filters intersect, and examine_re alone also
# lists unrelated "delete field" mutants.
additional_cargo_args = ["--features", "testkit provider-native provider-codex provider-acp"]
examine_globs = [
  "**/src/providers/claude_code/map_events.rs",
  "**/src/providers/acp/map.rs",
  "**/src/providers/codex/map.rs",
  "**/src/agent/policy.rs",
  "**/src/providers/native/policy_args.rs",
  "**/src/model/wire.rs",
  "**/src/agent/error.rs",
]

# Equivalent mutants: replacing the code changes nothing a caller can observe, so no test can
# tell the two apart. Each is matched by file, line and column (move them if the code moves).
exclude_re = [
  # glob_match, `p = star_at + 1` -> `p = star_at * 1`: `p` then points at the `*` itself, the
  # next iteration reads it, records the same star and the same mark, and steps to `star_at + 1`.
  # Same state, one iteration later.
  "agent/policy\\.rs:340:25: replace \\+ with \\* in glob_match",
  # decide_call, `AllowOn::Each(each) if each.is_empty()`: unreachable. `Forms::allow` is built as
  # `Each(vec![one])` or, for a command, `Each(parts)` only when `parts` is not empty (see
  # command_forms); the guard is a defence for a state the module never produces.
  "native/policy_args\\.rs:79:36: replace match guard each\\.is_empty\\(\\) with false in decide_call",
  # normalise, `Path::is_absolute() || path.starts_with('/')` -> `&&`: on Unix every path that
  # starts with `/` is absolute, so both operands agree. The `||` is for Windows, where a
  # drive-less `/x` is not "absolute"; this cannot be observed on the platforms mutants run on.
  "native/policy_args\\.rs:188:53: replace \\|\\| with && in normalise",
  # substitution, `open = start + 1` and `chars[open + 1..end]` -> `* 1`: the text handed to
  # split_into then starts with the `(` of `$(` (or `<(`). In split_into a `(` flushes an empty
  # `current` and does nothing else, so the parts and the inner commands are the same.
  "native/policy_args\\.rs:515:22: replace \\+ with \\* in substitution",
  "native/policy_args\\.rs:531:36: replace \\+ with \\* in substitution",
]
