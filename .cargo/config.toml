# Resolve dependencies to versions that build with the workspace `rust-version` (1.88).
# Without this, a fresh resolution (Cargo.lock is not committed) takes the newest release of every
# crate even when it needs a newer Rust: uuid 1.27.0 requires 1.89 and broke the MSRV job and main
# on 2026-10-02. Stable since cargo 1.84.
[resolver]
incompatible-rust-versions = "fallback"

# `cargo xtask …` runs the repository's own chores (xtask/): the diagram index and the diagram
# drift gate. A workspace crate rather than a script, so the repository needs one toolchain.
[alias]
xtask = "run --quiet --package xtask --"
# Formats the nexus crates only. `cargo fmt --all` (and plain `cargo fmt` at the root) would also
# reformat the vendored Obscura crates (obscura/), which keep upstream's formatting so that upstream
# changes still apply to them.
fmt-nexus = "fmt -p claude-code-api -p nexus-claude -p nexus-tools -p xtask"
