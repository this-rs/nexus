# cargo-deny configuration for Nexus
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # Both reach only the vendored Obscura crates (obscura/), which are not default members and
    # are compiled only when named. Unmaintained, no known
    # vulnerability, and no maintained release of their dependents drops them yet.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x, unmaintained: a dependency of deno_core (V8 snapshot data) under obscura-js" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash, unmaintained: a hashing helper under the html5ever/selectors stack of obscura-dom" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    # The successor of Unicode-DFS-2016, on the ICU4X crates (idna -> url) and unicode-ident.
    "Unicode-3.0",
    # The Mozilla CA list of webpki-roots (via reqwest/hyper-rustls and neo4rs).
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Deny specific crates
deny = []

# Skip specific crate versions for duplicate detection
skip = []

# Skip checking the entire tree for specific crates
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
