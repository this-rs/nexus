name: CI

on:
  push:
    branches: [main, 'v*']
  pull_request:
    branches: [main, 'v*']

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Format check - runs first and fast
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # Clippy lints
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Build and test matrix
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    needs: fmt
    # Nightly is advisory only: rustc nightly is prone to ICEs (internal compiler
    # errors) unrelated to our code — don't let a toolchain regression block CI.
    continue-on-error: ${{ matrix.toolchain == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, beta]
        include:
          - os: ubuntu-latest
            toolchain: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ matrix.toolchain }}
          components: ''

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: cargo build --all-features --verbose

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cargo build --features auto-download --verbose

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: cargo test --all-features --verbose

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --features auto-download --verbose

      - name: Run doc tests (Unix)
        if: runner.os != 'Windows'
        run: cargo test --doc --all-features

      - name: Run doc tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --doc --features auto-download

  # Code coverage
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Documentation build
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust

      - name: Build documentation
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run cargo-deny
        run: cargo deny check
        continue-on-error: true  # Advisory only for now

  # MSRV check
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: '1.88'
          components: ''

      - name: Build with MSRV
        run: cargo build --all-features

  # Diagram <-> code drift (task 1.1).
  #
  # The charter invariants run inside the ordinary `test` job. This job exists
  # only to supply the pull request context the drift check needs: which files
  # changed, and which commits carry a `Diagram-Unchanged:` trailer. It is kept
  # separate so the computation stays out of the test matrix (it would run five
  # times for nothing) and so its result reads clearly on the pull request.
  #
  # Offline: the change set comes from the checkout already on disk, and the
  # check itself makes no network call.
  diagram-drift:
    name: Diagram drift
    runs-on: ubuntu-latest
    needs: fmt
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the merge base to diff against the target branch.
          fetch-depth: 0

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: ''

      - name: Collect the pull request context
        run: |
          base="origin/${{ github.base_ref }}"
          {
            echo 'DIAGRAM_DRIFT_CHANGED_FILES<<__EOF__'
            git diff --name-only "$base...HEAD"
            echo '__EOF__'
            echo 'DIAGRAM_DRIFT_TRAILERS<<__EOF__'
            # Only the trailer lines; one per excused diagram.
            git log --format='%(trailers:key=Diagram-Unchanged)' "$base..HEAD"
            echo '__EOF__'
          } >> "$GITHUB_ENV"

      - name: Check diagram drift
        run: cargo test -p claude-code-api --test diagram_index

  # Final CI status check
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, docs, msrv, diagram-drift]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.fmt.result }}" != "success" ]] || \
             [[ "${{ needs.clippy.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.docs.result }}" != "success" ]] || \
             [[ "${{ needs.msrv.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          # diagram-drift is skipped on a push to main, and only there: the
          # check compares a pull request against its target branch, and a push
          # to the target branch has nothing to compare. "skipped" is therefore
          # accepted ONLY for a push event; on a pull request the job must have
          # succeeded. This is the written justification the release readiness
          # gate requires for a tolerated non-success result.
          drift="${{ needs.diagram-drift.result }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ "$drift" != "success" ]]; then
              echo "diagram-drift did not pass on a pull request (result: $drift)"
              exit 1
            fi
          elif [[ "$drift" != "skipped" && "$drift" != "success" ]]; then
            echo "diagram-drift failed outside a pull request (result: $drift)"
            exit 1
          fi
          echo "All CI checks passed!"
