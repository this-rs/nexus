name: CI

on:
  push:
    branches: [main, 'v*']
  pull_request:
    branches: [main, 'v*']

# A new push to a pull request makes the previous run pointless: cancel it instead of burning
# 8 runner-jobs (three of them on the expensive macOS / Windows images). Never on main, where
# every push must keep its own verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # A CI build starts from a clean checkout, so incremental compilation only writes state nobody
  # reads (and bloats the cache).
  CARGO_INCREMENTAL: 0
  # The workspace has ~80 test binaries, each linking the whole library. Full debug info is what
  # makes those links (and the cache) heavy; line tables keep the file:line of backtraces and
  # panics, which is all a CI log needs.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_NET_RETRY: 5

jobs:
  # Format check - runs first and fast
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt-nexus -- --check

      # The diagram index is DERIVED from the .mmd headers, so it can go stale
      # the moment a file moves. This re-derives it and fails if the committed
      # INDEX.yml differs, or if a header is malformed, a `covers` glob matches
      # nothing, or two diagrams claim the same source file.
      #
      # `xtask` is a workspace crate with no dependency: it builds in seconds
      # with the toolchain this job already has. The check itself is offline;
      # cargo still reads the registry index to resolve the workspace, since
      # Cargo.lock is not committed.
      #
      # It does NOT check that a diagram still describes what its files do —
      # only that the ownership map is well formed and current. The `diagram-drift`
      # job below asks that question on every pull request; neither is proof
      # that the diagrams are accurate.
      - name: Check the diagram index is derived and current
        run: cargo xtask diagrams index --check

  # A pull request that changes a file a diagram owns must either change that
  # diagram or say, in a commit message, `Diagram-Unchanged: <name> — <reason>`.
  # See xtask/src/drift.rs for the rule and what it does not prove.
  #
  # Pull requests only: on a push to main there is no branch to compare, and a
  # squash merge may have rewritten the messages that carried the trailers.
  # The PR HEAD is checked out (not GitHub's merge commit) with full history,
  # so `origin/<base>...HEAD` is exactly what the branch changed.
  diagram-drift:
    name: Diagram drift
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
      - name: Check changed code against the diagrams that own it
        run: cargo xtask diagrams drift --base "origin/${{ github.base_ref }}"

  # Clippy lints
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - name: Run Clippy
        run: |
          features="$(scripts/nexus-features.sh)"
          cargo clippy --all-targets --features "$features" -- -D warnings

  # Test matrix. Ubuntu / stable is NOT here: it is the `coverage` job below, which runs the same
  # `cargo test` (every feature but obscura) instrumented, so the suite is run once on that platform instead
  # of twice (a plain run, then a second one for the coverage figure).
  #
  # beta and nightly only run on Linux: they watch for a compiler regression, which does not
  # depend on the operating system. Windows and macOS keep stable, where the platform-specific
  # code (paths, processes, signals) is exercised.
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    # A healthy job takes about 3 minutes; 30 cuts off a hung test (PR #45: two `start_paused`
    # tests deadlocked on Windows and the job sat silent for 49 minutes) instead of holding a
    # runner for GitHub's 6-hour default.
    timeout-minutes: 30
    # Nightly is advisory only: rustc nightly is prone to ICEs unrelated to our code.
    continue-on-error: ${{ matrix.toolchain == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, toolchain: stable }
          - { os: windows-latest, toolchain: stable }
          - { os: ubuntu-latest, toolchain: beta }
          - { os: ubuntu-latest, toolchain: nightly }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ matrix.toolchain }}
          components: ''

      # No separate `cargo build` and no separate `cargo test --doc`: `cargo test` builds
      # everything it runs and already runs the doc tests. The non-test build of every target is
      # covered by Clippy (--all-targets) and by the MSRV job.
      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: |
          features="$(scripts/nexus-features.sh)"
          cargo test --features "$features"

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --features auto-download

  # One job per provider: the conformance suite of the agent contract against that provider's
  # fake executable (fake_claude, fake_openai + fake_mcp, fake_codex, fake_acp), built with that
  # provider's features only. The same tests also run inside `coverage`; here a broken scenario
  # turns ONE named job red (the provider is in the job name), and a provider whose tests only
  # pass with another provider's feature turned on is caught. No real CLI, no key, no network
  # beyond 127.0.0.1. The real-CLI tests stay `#[ignore]`d (docs/CI_CD.md, "Live tests").
  conformance:
    name: Conformance (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: claude-code
            features: testkit
            tests: --test claude_code_conformance
          - provider: native
            features: testkit,provider-native
            tests: --test native_conformance
          - provider: codex
            features: testkit,provider-codex
            tests: --test codex_conformance
          - provider: acp
            features: testkit,provider-acp
            tests: --test acp_conformance --test acp_conformance_matrix
          # The suite itself, on the scripted provider: its negative controls prove each
          # faulty provider makes the suite fail (a suite that cannot fail proves nothing).
          - provider: scripted
            features: testkit
            tests: --test agent_conformance
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: ''
      - name: Conformance against the fake executable
        run: cargo test -p nexus-claude --no-default-features --features "${{ matrix.features }}" ${{ matrix.tests }}

  # Ubuntu / stable: the test suite, run once, instrumented. Its result is the platform's test
  # verdict AND the coverage figure; there is no second plain run.
  coverage:
    name: Test + Coverage (ubuntu-latest / stable)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        run: |
          features="$(scripts/nexus-features.sh)"
          cargo llvm-cov --features "$features" --lcov --output-path lcov.info

      # `cargo llvm-cov` does not run doc tests on stable.
      - name: Run doc tests
        run: |
          features="$(scripts/nexus-features.sh)"
          cargo test --doc --features "$features"

      # The repo's reference figure, produced here and nowhere else (two people once quoted two
      # different "96.7 %" an hour apart because the convention lived in prose). `report` re-reads
      # the profdata the step above already merged: seconds, not a second run. Not a gate yet.
      - name: Measure and publish logic coverage
        run: |
          set -euo pipefail
          cargo llvm-cov report --json \
            --ignore-filename-regex '(examples/|/tests/|src/bin/)' \
            --output-path cov-logic.json
          # No pipe here on purpose: a shell reports the LAST command of a
          # pipeline, so `... | tee` would hide the script refusing the export.
          python3 scripts/coverage_logic_only.py cov-logic.json \
            --strip-prefix "${GITHUB_WORKSPACE}/" > logic-coverage.txt
          cat logic-coverage.txt
          {
            echo '### Logic coverage'
            echo
            echo 'Excludes `examples/`, `/tests/` and `src/bin/`: scaffolding and'
            echo 'entry points are not the logic under measurement.'
            echo
            echo '```'
            tail -n 3 logic-coverage.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Documentation build
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust

      - name: Build documentation
        run: |
          features="$(scripts/nexus-features.sh)"
          cargo doc --features "$features" --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The one job that compiles the vendored Obscura (obscura/) and links V8: nexus-tools with its
  # `obscura` feature, plus every Obscura crate's own tests. Every other job leaves the feature out
  # (scripts/nexus-features.sh) and stays V8-free.
  #
  # V8 is a prebuilt static library that the `v8` build script would download unverified;
  # scripts/rusty-v8-cache.sh puts a copy whose SHA-256 it pins in rusty_v8's own cache first, so
  # the build copies that one (the version is pinned with `v8 = "=..."` in obscura-js, and the
  # script refuses a mismatch). `--target` keeps the host and target copies of `v8` (obscura-js
  # builds a V8 snapshot at build time) in separate directories.
  # Offline tests: fixed `data:` pages, the time limit and the cancellation paths.
  obscura:
    name: Obscura (nexus-tools --features obscura, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy

      - name: Fetch V8 (rusty_v8), pinned and checksum-verified
        run: scripts/rusty-v8-cache.sh x86_64-unknown-linux-gnu

      # `--no-deps`: the vendored crates keep upstream's code and its warnings; only nexus-tools
      # is held to -D warnings.
      - name: Clippy (nexus-tools with obscura)
        run: >-
          cargo clippy --target x86_64-unknown-linux-gnu -p nexus-tools --no-deps --all-targets
          --features tls,test-tools,obscura -- -D warnings

      - name: Test nexus-tools with obscura
        run: cargo test --target x86_64-unknown-linux-gnu -p nexus-tools --features tls,test-tools,obscura

      # One process per test (nextest): upstream's tests set process-wide V8 flags and environment
      # variables, and fail when `cargo test` runs them side by side in one process (measured: 1209
      # pass under nextest; under `cargo test`, 8 fail or abort on "Check failed: !IsFrozen()").
      # `paint`: obscura-render's unit tests read fields that exist only with it.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Test the Obscura crates
        run: >-
          cargo nextest run --target x86_64-unknown-linux-gnu -p obscura -p obscura-browser -p obscura-cdp -p obscura-cli -p obscura-dom
          -p obscura-js -p obscura-mcp -p obscura-net -p obscura-render -p obscura-server
          --features obscura-render/paint

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run cargo-deny
        run: cargo deny check
        continue-on-error: true  # Advisory only for now

  # MSRV check
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: '1.88'
          components: ''

      # `check`, not `build`: the same type checking and dependency resolution at 1.88, without
      # code generation or linking, which is where a build spends its time.
      - name: Check with MSRV
        run: |
          features="$(scripts/nexus-features.sh)"
          cargo check --features "$features"

  # Final CI status check
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [fmt, diagram-drift, clippy, test, conformance, coverage, docs, msrv, obscura]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.fmt.result }}" != "success" ]] || \
             [[ "${{ needs.clippy.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.conformance.result }}" != "success" ]] || \
             [[ "${{ needs.coverage.result }}" != "success" ]] || \
             [[ "${{ needs.docs.result }}" != "success" ]] || \
             [[ "${{ needs.obscura.result }}" != "success" ]] || \
             [[ "${{ needs.msrv.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          # `skipped` is the expected result on a push (the job is PR-only).
          drift="${{ needs.diagram-drift.result }}"
          if [[ "$drift" != "success" && "$drift" != "skipped" ]]; then
            echo "Diagram drift check: $drift"
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"
