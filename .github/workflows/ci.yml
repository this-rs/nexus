name: CI

on:
  push:
    branches: [main, 'v*']
  pull_request:
    branches: [main, 'v*']

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Format check - runs first and fast
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

      # The diagram index is DERIVED from the .mmd headers, so it can go stale
      # the moment a file moves. This re-derives it and fails if the committed
      # INDEX.yml differs, or if a header is malformed, a `covers` glob matches
      # nothing, or two diagrams claim the same source file.
      #
      # Python 3 is already on ubuntu runners: no setup step, no new toolchain
      # in a Rust repository, and no network.
      #
      # It does NOT check that a diagram still describes what its files do —
      # only that the ownership map is well formed and current. The `diagram-drift`
      # job below asks that question on every pull request; neither is proof
      # that the diagrams are accurate.
      - name: Check the diagram index is derived and current
        run: |
          python3 -m unittest scripts/test_derive_diagram_index.py
          python3 scripts/derive_diagram_index.py
          python3 scripts/derive_diagram_index.py --write
          git diff --exit-code -- docs/diagrams/INDEX.yml \
            || { echo "::error::INDEX.yml is stale — run python3 scripts/derive_diagram_index.py --write"; exit 1; }

  # A pull request that changes a file a diagram owns must either change that
  # diagram or say, in a commit message, `Diagram-Unchanged: <name> — <reason>`.
  # See scripts/check_diagram_drift.py for the rule and what it does not prove.
  #
  # Pull requests only: on a push to main there is no branch to compare, and a
  # squash merge may have rewritten the messages that carried the trailers.
  # The PR HEAD is checked out (not GitHub's merge commit) with full history,
  # so `origin/<base>...HEAD` is exactly what the branch changed.
  diagram-drift:
    name: Diagram drift
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check changed code against the diagrams that own it
        run: |
          python3 -m unittest scripts/test_check_diagram_drift.py
          python3 scripts/check_diagram_drift.py --base "origin/${{ github.base_ref }}"

  # Clippy lints
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Build and test matrix
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    needs: fmt
    # A healthy job takes ~3 min on Unix and 3.5-4.5 min on Windows (measured on
    # PR #43 and #44), build and doc tests included. 30 minutes is roughly six
    # times the worst of that, so a cold dependency cache or a slow runner will
    # never trip it, while a hung test is cut off after 30 minutes instead of
    # holding a runner for GitHub's 6-hour default. PR #45 did exactly that:
    # two `start_paused` tests deadlocked on Windows and the job sat silent for
    # 49 minutes before being cancelled by hand.
    timeout-minutes: 30
    # Nightly is advisory only: rustc nightly is prone to ICEs (internal compiler
    # errors) unrelated to our code — don't let a toolchain regression block CI.
    continue-on-error: ${{ matrix.toolchain == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, beta]
        include:
          - os: ubuntu-latest
            toolchain: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ matrix.toolchain }}
          components: ''

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: cargo build --all-features --verbose

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cargo build --features auto-download --verbose

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: cargo test --all-features --verbose

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --features auto-download --verbose

      - name: Run doc tests (Unix)
        if: runner.os != 'Windows'
        run: cargo test --doc --all-features

      - name: Run doc tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --doc --features auto-download

  # Code coverage
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      # The repo's reference figure, produced here and nowhere else. It used to
      # exist only as a usage line in the script's docstring, with no caller at
      # all: `--ignore-filename-regex` appeared exactly once in the tree, in that
      # comment. A measurement convention that lives in prose is not a convention,
      # and two people quoted two different "96.7 %" an hour apart because of it.
      #
      # `report` re-reads the profdata the step above already merged, so this
      # costs seconds rather than a second run of the suite. Not a gate yet: a
      # threshold and a new producer in one change would leave nobody able to say
      # which of the two broke.
      - name: Measure and publish logic coverage
        run: |
          set -euo pipefail
          cargo llvm-cov report --json \
            --ignore-filename-regex '(examples/|/tests/|src/bin/)' \
            --output-path cov-logic.json
          # No pipe here on purpose: a shell reports the LAST command of a
          # pipeline, so `… | tee` would hide the script refusing the export.
          python3 scripts/coverage_logic_only.py cov-logic.json \
            --strip-prefix "${GITHUB_WORKSPACE}/" > logic-coverage.txt
          cat logic-coverage.txt
          {
            echo '### Logic coverage'
            echo
            echo 'Excludes `examples/`, `/tests/` and `src/bin/`: scaffolding and'
            echo 'entry points are not the logic under measurement.'
            echo
            echo '```'
            tail -n 3 logic-coverage.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Documentation build
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust

      - name: Build documentation
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run cargo-deny
        run: cargo deny check
        continue-on-error: true  # Advisory only for now

  # MSRV check
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: '1.88'
          components: ''

      - name: Build with MSRV
        run: cargo build --all-features

  # Final CI status check
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [fmt, diagram-drift, clippy, test, docs, msrv]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.fmt.result }}" != "success" ]] || \
             [[ "${{ needs.clippy.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.docs.result }}" != "success" ]] || \
             [[ "${{ needs.msrv.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          # `skipped` is the expected result on a push (the job is PR-only).
          drift="${{ needs.diagram-drift.result }}"
          if [[ "$drift" != "success" && "$drift" != "skipped" ]]; then
            echo "Diagram drift check: $drift"
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"
