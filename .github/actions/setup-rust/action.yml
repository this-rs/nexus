name: 'Setup Rust'
description: 'Setup Rust toolchain with caching for Nexus CI/CD'

inputs:
  toolchain:
    description: 'Rust toolchain to install (stable, beta, nightly)'
    required: false
    default: 'stable'
  components:
    description: 'Additional components to install (comma-separated: clippy, rustfmt)'
    required: false
    default: 'clippy, rustfmt'
  targets:
    description: 'Additional targets to install (comma-separated)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: 'nexus-rust'
        # NO shared-key: it made every job of the same OS and toolchain (fmt, clippy, docs, test,
        # coverage, audit, drift) read and write ONE entry. The first to finish, `fmt`, saved a
        # 74 MB cache holding almost no dependency, and the others (which cannot overwrite an
        # existing key) all started cold. By default the key carries the job id, so each kind of
        # build keeps its own artifacts (clippy metadata, test binaries, rustdoc, instrumented).
        cache-bin: true
        cache-on-failure: true
        # Only main writes the cache; pull requests read it. Otherwise every branch re-saves
        # 400 MB per job and evicts the entries main depends on (10 GB limit per repository).
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Print Rust version
      shell: bash
      run: |
        rustc --version
        cargo --version
        rustup show
