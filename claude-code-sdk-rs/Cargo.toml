[package]
name = "nexus-claude"
version = "0.5.0"
edition = "2024"
rust-version.workspace = true
authors = [
    "Original: ZhangHanDong <psiace@outlook.com>",
    "Fork: Théotime Rivière"
]
license = "MIT"
description = "Claude Code SDK for Rust with persistent memory and autonomous context retrieval. Fork of cc-sdk."
repository = "https://github.com/this-rs/nexus"
documentation = "https://docs.rs/nexus-claude"
readme = "README.md"
keywords = ["claude", "nexus", "memory", "ai", "sdk", "mcp"]
categories = ["api-bindings", "asynchronous", "development-tools"]
exclude = ["examples/", "tests/", "doc/", "README_*.md", "*.sh", "*.py"]

# Fork notice: This is a fork of https://github.com/ZhangHanDong/claude-code-api-rs
# with additional features for persistent memory and autonomous context retrieval.

[dependencies]
# Workspace dependencies
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures.workspace = true
async-trait.workspace = true

# Local dependencies
tokio-stream = { version = "0.1", features = ["sync"] }
bytes = "1"
pin-project-lite = "0.2"
which = "6"
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }
async-stream = "0.3"
rand = "0.8"
crossbeam-channel = "0.5"
libc = "0.2"
# For auto-downloading CLI
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false, optional = true }
# For memory system
meilisearch-sdk = { version = "0.33", default-features = false, features = ["reqwest", "tls", "jwt_rust_crypto"], optional = true }
chrono = { version = "0.4", optional = true }

[features]
default = ["auto-download"]
# Enable automatic CLI download when not found
auto-download = ["reqwest"]
# Enable persistent memory system (Meilisearch-based)
memory = ["meilisearch-sdk", "chrono"]
# Test kit of the agent contract: ScriptedProvider, transcripts, conformance suite.
# Meant for the dev-dependencies of a host; not built by default.
testkit = []
# HTTP model endpoints (OpenAI-compatible chat/completions + SSE): `model` module.
# Pulls `reqwest` (rustls, no `json`/`stream` features); not in `default`.
provider-native = ["reqwest"]
# Codex `app-server` (JSON-RPC over stdio) behind the agent contract: `providers::codex`.
# Needs no extra dependency (the process is launched through `transport::spawn`).
provider-codex = []
# Any ACP (Agent Client Protocol) agent over stdio behind the agent contract: `providers::acp`.
# Needs no extra dependency (the process is launched through `transport::spawn`).
provider-acp = []

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
serial_test = "3"
mockall = "0.13"
wiremock = "0.6"
tokio-test = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
chrono = "0.4"
regex = "1.10"
axum = "0.6"
tower-http = { version = "0.4", features = ["cors"] }

[[test]]
name = "agent_conformance"
required-features = ["testkit"]

# Harness and model provider apart (N16): the pairs, the binding, the credential grant.
[[test]]
name = "model_binding"
required-features = ["provider-native"]

# The mandatory security scenarios run against every provider that ships.
[[test]]
name = "agent_security"
required-features = ["testkit", "provider-native", "provider-codex", "provider-acp"]

[[test]]
name = "claude_code_conformance"
required-features = ["testkit"]

[[test]]
name = "model_openai_endpoint"
required-features = ["provider-native"]

[[test]]
name = "native_conformance"
required-features = ["testkit", "provider-native"]

[[test]]
name = "native_harness"
required-features = ["provider-native"]

[[test]]
name = "agent_registry"
required-features = ["provider-native"]

[[test]]
name = "codex_conformance"
required-features = ["testkit", "provider-codex"]

# What the adapter sends, checked offline against the real 0.160.0 schema and answers.
[[test]]
name = "codex_real_schema"
required-features = ["provider-codex"]

# The adapter against a REAL codex app-server; ignored unless NEXUS_REAL_CODEX is set.
[[test]]
name = "codex_real"
required-features = ["provider-codex"]

[[test]]
name = "codex_schema_drift"
required-features = ["provider-codex"]

[[test]]
name = "codex_registry"
required-features = ["provider-codex"]

[[test]]
name = "acp_conformance"
required-features = ["testkit", "provider-acp"]

[[test]]
name = "acp_schema_drift"
required-features = ["provider-acp"]

[[test]]
name = "acp_registry"
required-features = ["provider-acp"]
