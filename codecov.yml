# Codecov configuration for Nexus
# https://docs.codecov.io/docs/codecov-yaml

coverage:
  precision: 2
  round: down
  range: "60...100"

  status:
    project:
      default:
        target: auto
        threshold: 2%
        # Informational until the baseline is raised (sdk ~69%, api ~39%):
        # the project-wide status never fails; only the patch gate blocks.
        informational: true
    patch:
      default:
        target: 80%
        # Blocking: lines changed by a PR must be >=80% covered.
      agent-contract:
        target: 90%
        # Blocking, stricter: the agent contract and the event mapping of the providers are
        # what every host relies on; lines a PR changes there must be >=90% covered.
        paths:
          - "claude-code-sdk-rs/src/agent/**"
          - "claude-code-sdk-rs/src/providers/*/map_events.rs"

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
  require_base: no
  require_head: yes

ignore:
  - "examples/**"
  - "tests/**"
  - "**/test*.rs"
  - "**/mod.rs"  # Module files typically don't have logic
  - "claude-code-sdk-rs/src/bin/fake_*.rs"  # fakes played as subprocesses (CARGO_BIN_EXE_*): never instrumented, so their lines are not coverable source

flags:
  sdk:
    paths:
      - claude-code-sdk-rs/src/**
    carryforward: true
  api:
    paths:
      - claude-code-api/src/**
    carryforward: true
